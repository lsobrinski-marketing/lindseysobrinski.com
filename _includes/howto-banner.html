<a class="howto-banner" href="/blog/{{ include.slug }}/">
  <span class="howto-banner-media">
    <img src="/assets/img/blog/{{ include.slug }}.png" alt="Illustration for {{ include.title }}" loading="lazy" width="400" height="223">
  </span>
  <span class="howto-banner-text">
    <span class="howto-banner-kicker">The how-to</span>
    <span class="howto-banner-title">{{ include.title }}</span>
    <span class="howto-banner-fix">{{ include.fix }}</span>
    <span class="howto-banner-go">Read the how-to &rarr;</span>
  </span>
</a>
